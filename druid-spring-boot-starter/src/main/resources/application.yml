mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# Performance test configuration - all can be overridden via -D flags
# e.g., -Dperf.batch-size=2000 -Dperf.max-records=100000
perf:
  enabled: ${PERF_ENABLED:true}
  warmup-batches: ${PERF_WARMUP_BATCHES:2}
  thread-count: ${PERF_THREAD_COUNT:1}
  queue-capacity: ${PERF_QUEUE_CAPACITY:15}

  data-post-handler: ${PERF_DATA_POST_HANDLER:res-update}
  write-failed-file: ${PERF_WRITE_FAILED_FILE:true}
  write-result-db: ${PERF_WRITE_RESULT_DB:true}
  flush-threshold: ${PERF_FLUSH_THRESHOLD:70}
  error-only: ${PERF_ERROR_ONLY:false}

  data-fetcher-type: ${PERF_DATA_FETCHER_TYPE:sql-res}
  start-id: ${PERF_START_ID:0}
  max-records: ${PERF_MAX_RECORDS:10000000}
  batch-size: ${PERF_BATCH_SIZE:2500}
  max-consecutive-empty: ${PERF_MAX_CONSECUTIVE_EMPTY:15}
  db-type: ${PERF_DB_TYPE:oracle}
  tenant-id: ${PERF_TENANT_ID:0}

# 日志配置统一由 logback-spring.xml 管理
